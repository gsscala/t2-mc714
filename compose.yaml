services:
  node1:
    build: .
    container_name: mc714-node1
    command: >
      node
      --id node1
      --host 0.0.0.0
      --port 8001
      --peers "node1=node1:8001,node2=node2:8002,node3=node3:8003,node4=node4:8004,node5=node5:8005"
      --auditor node1
    ports:
      - "8001:8001"
    volumes:
      - ./wal_data/node1:/app/wal_data
    networks:
      - mc714-net
    restart: unless-stopped

  node2:
    build: .
    container_name: mc714-node2
